[project]
name = "explainableckg"
version = "0.1.0"
description = "Explainable Medical GraphRAG"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "accelerate>=1.14.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.1",
    "owlready2>=0.51",
    "pandas>=3.0.3",
    "rdflib>=7.6.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "tqdm>=4.68.4",
    "transformers>=5.13.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
graphrag = "explainable_graphrag.app:main"


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
